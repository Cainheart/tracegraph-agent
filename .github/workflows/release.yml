name: TraceGraph Release Artifact

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: tracegraph-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  CODEBUDDY_SAFE_DELETE_ENABLED: "0"

jobs:
  release-artifact:
    name: Verify and assemble private workspace artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.19.0
          runtime: node@22.19.0
          cache: true
          install: false
      - run: node scripts/verify-lockfile.mjs --skip-frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm supply-chain:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm coverage
      - run: pnpm evals
      - name: Build release manifest
        env:
          TRACEGRAPH_RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm build && node scripts/verify-release.mjs --write-manifest --tag "$TRACEGRAPH_RELEASE_TAG"
      - name: Upload checksummed release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tracegraph-${{ github.ref_name }}
          path: |
            _tmp_release/bundle/
            _tmp_release/release-manifest.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
