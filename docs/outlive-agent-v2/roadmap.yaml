schema_version: 1
roadmap: outlive-agent-v2
status: proposed
last_reviewed: 2026-10-03

execution_rules:
  one_primary_change_type_per_task: true
  target_non_mechanical_diff_lines: 500
  hard_review_threshold_lines: 800
  require_current_target_separation: true
  require_negative_gate_test: true
  require_actual_command_report: true
  forbid_baseline_refresh_without_explanation: true

phases:
  - id: P0
    title: 决策、文档与基线
    exit_criteria:
      - V2 名称和产品边界有正式 Note 结论
      - current truth 与 target design 可从入口定位
      - 当前架构/测试/性能基线可重跑
  - id: P1
    title: 架构与不变量门禁
    depends_on: [P0]
    exit_criteria:
      - 包依赖、关键不变量和文档漂移均可使 CI 失败
  - id: P2
    title: core 内部成层
    depends_on: [P1]
    exit_criteria:
      - kernel/domains/seams 依赖方向受守卫
      - runtime 主循环只保留协调职责
  - id: P3
    title: 稳定 family 升包
    depends_on: [P2]
    exit_criteria:
      - 达到升包门槛的边界成为窄 package API；其余保留内部 seam 并记录裁决
  - id: P4
    title: Memory 与 Experience
    depends_on: [P2]
    exit_criteria:
      - 记忆拥有证据、状态、作用域、修订和遗忘生命周期
  - id: P5
    title: Runtime 可靠性
    depends_on: [P2]
    exit_criteria:
      - no-progress、cancel、retry、unknown/reconcile 可区分且可证明
  - id: P6
    title: 三种产品入口与 Desktop
    depends_on: [P3]
    exit_criteria:
      - CLI/Web UI/Desktop 共享内部 Command/Query/Event 语义
  - id: P7
    title: 回归、性能、i18n 与文档
    depends_on: [P4, P5, P6]
    exit_criteria:
      - Snapshot、Benchmark、Langfuse 外部评估流程与 i18n/docs 门禁具备各自明确的运行和报告边界
  - id: P8
    title: 公开证明与发布
    depends_on: [P7]
    exit_criteria:
      - 三条核心演示可独立复现
      - HOST-087/PAR-088/CLI-089/SET-090/DEV-091/RUN-092/BRAND-093/MEDIA-094/DIST-095 与 UX-086 安装即用验收有一致实现、三端操作证据和当前文档
      - macOS/Windows 安装包携带运行时与 CLI，用户无需 Node/pnpm 或手动启动服务即可配置模型并完成任务
      - 外部用户可从零安装并跑通

tasks:
  - id: OLV-000
    phase: P0
    title: 评审 V2 宪章与未决设计决定
    owner: human-maintainer
    change_type: decision
    depends_on: []
    outputs:
      - .agents/notes/proposed/2026-09-23-outlive-agent-v2.md
      - .agents/notes/proposed/2026-09-23-outlive-agent-v2.zh.md
      - docs/outlive-agent-v2/README.md
    acceptance:
      - 主设计决策逐项有结论，且 Current/Target/Deferred 边界一致
      - DEC-01–12 已结合 DSH 源码/文档对照并记录为 accepted；接受仅表示评审通过，不表示代码实现
      - Outlive Agent V2 Note 在实现证据齐备前继续位于 proposed，不因设计评审完成而移动到 implemented
      - 决策登记表区分已接受、待评审、已延后；未到阶段的决定有明确裁决时机，不冒充已接受
      - Outlive Agent 已确定为产品与底层 Agent Runtime/技术内核的统一名称
      - 最终 package scope 为 @outlive/*；维护者确认名称核查已完成，@tracegraph/* 仅迁移期保留且改名须独立兼容迁移方案
      - V2 不提供多人团队共享 Workspace/Memory；该产品能力留待 V2 后评审，不与内部多 Agent 协作混淆
      - 当前产品入口限定为 CLI、Web UI、Desktop；独立 API、SDK、ACP 不纳入范围
      - LSP 为可选只读代码导航接缝（definition/references/implementation/hover），服务端由部署配置；Current diagnostics 不自动进入目标，CodeGraph 不纳入内建 V2 能力或迁移目标
      - 维护者确认公开发布前的商标、域名、包名及主要社交账号核查已完成

  - id: GOV-001
    phase: P0
    title: 建立 AGENTS、Notes 与 Skills 治理入口
    owner: repository
    change_type: governance
    depends_on: []
    outputs: [AGENTS.md, .agents/notes/README.md, .agents/skills/README.md]
    acceptance:
      - 规则使用薄指针且不复制上级 workspace 工作流
      - proposed implemented rejected archived 生命周期清楚

  - id: DOC-002
    phase: P0
    title: 校验 V2 文档清单和任务 DAG
    owner: scripts
    change_type: tooling
    depends_on: [GOV-001]
    outputs: [scripts/verify-v2-docs.mjs]
    acceptance:
      - 缺失路径、非法状态、重复 task id、依赖环均 exit 1
      - checker 有最小违规 fixture 测试

  - id: BASE-003
    phase: P0
    title: 生成当前仓库可复现基线
    owner: scripts
    change_type: tooling
    depends_on: [DOC-002]
    outputs: [docs/generated/current-baseline.md]
    acceptance:
      - package DAG、LOC、测试/事件数量和关键性能由命令生成
      - 报告包含 commit、平台和生成时间
      - --check 只比较确定性结构数据；环境、时间和耗时样本作为诊断元数据

  - id: BOUND-004
    phase: P0
    title: 对齐 current docs 的明确边界
    owner: docs
    change_type: docs
    depends_on: [BASE-003]
    outputs: [README.md, docs/modules, docs/outlive-agent-v2/10-tracegraph-to-outlive-migration/README.md]
    acceptance:
      - Desktop 与 Memory V2 按当前源码和验收证据记录实现范围，保留未实现能力边界；不得永久沿用 P0 时的未实现快照
      - local-first、sandbox、remote scope 不含糊

  - id: ARCH-010
    phase: P1
    title: 建 architecture policy 与 dependency gate
    owner: scripts
    change_type: tooling
    depends_on: [BASE-003]
    outputs: [architecture-policy.yaml, scripts/verify-boundaries.mjs]
    acceptance:
      - 按已接受 DEC-01 实现物理升包硬门槛；策略文件名固定为 architecture-policy.yaml
      - verify-boundaries 实际读取 architecture-policy.yaml，不存在第二个机器规则真源
      - 当前依赖图通过
      - 临时反向依赖、deep import 和依赖环失败
      - 移除 CI 中的检查步骤时连线测试失败

  - id: ARCH-011
    phase: P1
    title: 生成 package/module graph
    owner: scripts
    change_type: tooling
    depends_on: [ARCH-010]
    outputs: [scripts/gen-module-graph.mjs, docs/generated/module-graph.md]
    acceptance:
      - --check 在生成物陈旧时失败

  - id: ARCH-012
    phase: P1
    title: 守卫单一 Ledger、wire 隔离与 Projection 纯度
    owner: scripts
    change_type: tests
    depends_on: [ARCH-010]
    outputs: [scripts/verify-invariants.mjs]
    acceptance:
      - 第二 writer、私有字段出 wire、Projection I/O 均被反向 fixture 捕获

  - id: ARCH-013
    phase: P1
    title: 引入 legacy/managed 渐进治理
    owner: architecture
    change_type: config
    depends_on: [ARCH-010]
    outputs: [architecture-policy.yaml, scripts/verify-boundaries.mjs]
    acceptance:
      - managed workspace package 的边界违规阻断检查
      - legacy workspace package 的边界违规只报告，且必须登记 migration_owner

  - id: DOC-014
    phase: P1
    title: package README contract gate
    owner: docs
    change_type: tooling
    depends_on: [ARCH-010]
    outputs: [scripts/verify-package-readmes.mjs]
    acceptance:
      - 缺责任、状态、模型影响、验证或限制时失败

  - id: CORE-020
    phase: P2
    title: 行为保持地提取 core kernel
    owner: core
    change_type: move
    depends_on: [ARCH-010, ARCH-012]
    outputs: [packages/core/src/kernel]
    acceptance:
      - 公开 API 和 canonical event 不变
      - kernel 不依赖 domains/seams

  - id: CORE-021
    phase: P2
    title: 移动 sandbox/lsp/mcp 到 seams
    owner: core
    change_type: move
    depends_on: [CORE-020]
    outputs: [packages/core/src/seams]
    acceptance:
      - seams 只依赖 kernel/contracts
      - 现有 focused、CLI 纵向 e2e 与 Ledger replay 无意外变化

  - id: CORE-022
    phase: P2
    title: 分离 Tool Definition 与 Executor/Policy
    owner: tool
    change_type: refactor
    depends_on: [CORE-020]
    outputs: [packages/core/src/kernel/tool, packages/core/src/domains/tools]
    acceptance:
      - 所有工具仍通过唯一 executor
      - 无新增工具或行为变化

  - id: CORE-023
    phase: P2
    title: 分离 Extension registration 与 lifecycle
    owner: extensions
    change_type: refactor
    depends_on: [CORE-020]
    outputs: [packages/core/src/kernel/registration, packages/core/src/domains/extensions]
    acceptance:
      - register/dispose/reload 行为不变

  - id: CORE-024
    phase: P2
    title: 将 core 平铺文件映射到 domains
    owner: core
    change_type: move
    depends_on: [CORE-021, CORE-022, CORE-023]
    outputs: [packages/core/src/domains]
    acceptance:
      - core/src 顶层仅保留 kernel domains seams index
      - current module docs 的源码链接同步

  - id: CORE-025
    phase: P2
    title: 提取 Run/Turn/Step 状态机
    owner: runtime
    change_type: refactor
    depends_on: [CORE-024]
    outputs: [packages/core/src/domains/runtime]
    acceptance:
      - canonical event 顺序与终态不变
      - 状态机有 table-driven tests

  - id: CORE-026
    phase: P2
    title: 提取 Context/Tool/Evidence façade
    owner: runtime
    change_type: refactor
    depends_on: [CORE-025]
    outputs: [runtime-service-facades]
    acceptance:
      - runtime 不深层 import 各域实现

  - id: CORE-027
    phase: P2
    title: 将 feature driver 改为扩展贡献
    owner: runtime
    change_type: refactor
    depends_on: [CORE-026]
    outputs: [feature-driver-registry]
    acceptance:
      - memory/team/todo/attachment 可单独禁用
      - agent-loop 无 feature-specific branch

  - id: CORE-028
    phase: P2
    title: 收敛 runtime.ts 为 loop coordinator
    owner: runtime
    change_type: refactor
    depends_on: [CORE-027]
    outputs: [small-agent-loop]
    acceptance:
      - runtime.ts 职责收敛、行数下降且可在 README 完整描述
      - focused/integration、CLI 纵向 e2e 与 Ledger replay 通过
      - canonical event 顺序、审批时点与外部工作区结果不变

  - id: PKG-030
    phase: P3
    title: 升包 Evidence family
    owner: evidence
    change_type: move
    depends_on: [CORE-028]
    outputs: [packages/evidence]
    acceptance:
      - Evidence package 仅依赖 contracts，Core 仅经 @tracegraph/evidence 根导出依赖它
      - Ledger/Artifact/Projection/Replay 行为通过公开 API contract tests
      - 唯一 Ledger writer 与无 I/O Projection 门禁指向 packages/evidence 源码
      - Core focused tests、CLI vertical E2E、Ledger replay 与架构文档验证通过

  - id: PKG-031
    phase: P3
    title: 升包 Session family
    owner: session
    change_type: move
    depends_on: [PKG-030]
    outputs: [packages/session]
    acceptance:
      - 先按 AGENTS 升包门槛裁决；未通过时保留内部 seam 并记录 Note
      - 当前 generation reader/writer/migration tests 通过

  - id: PKG-032
    phase: P3
    title: 升包 MCP 与 LSP seams
    owner: capabilities
    change_type: move
    depends_on: [CORE-028]
    outputs: [packages/mcp, packages/lsp]
    acceptance:
      - MCP 与 LSP 分别满足升包门槛；未通过者保留内部 seam 并记录 Note
      - 不依赖 core concrete runtime

  - id: PKG-033
    phase: P3
    title: 升包 Tool family
    owner: tool
    change_type: move
    depends_on: [PKG-030]
    outputs: [packages/tool]
    acceptance:
      - 先按 AGENTS 升包门槛裁决；未通过时保留内部 seam 并记录 Note
      - "@tracegraph/tool 仅依赖 contracts、zod 与 Node APIs；Core 内置定义和 Runtime/WAL/Receipt authority 留在 Core"
      - 包根 contract tests 覆盖 schema、Registry、bounded output、cancel/timeout、Policy deny 与 approval-token failure
      - Core Runtime integration 证明最终 deny 在 tool.started、Action WAL intent 与 mutation 前发生，且保持唯一 executor
      - boundary、README、module graph 与行为文档门禁通过

  - id: PKG-034
    phase: P3
    title: 升包 Context family
    owner: context
    change_type: move
    depends_on: [PKG-030]
    outputs: [packages/context]
    acceptance:
      - 先按 AGENTS 升包门槛裁决；未通过时保留内部 seam 并记录 Note
      - model-visible context 可由 manifest 重建
      - "@tracegraph/context 仅依赖 contracts、tool shared helpers 与 Node APIs；Core Runtime 是唯一生产 consumer，Note 记录模型可见信任边界硬隔离理由"
      - 包根 contract tests 覆盖构建/压缩/manifest 重建/取消与 spill；Core integration 使用真实 ArtifactStore
      - managed boundary、README、当前模块文档与 module graph 门禁通过

  - id: PKG-035
    phase: P3
    title: 提取 Boot 与 Profile loader
    owner: composition
    change_type: refactor
    depends_on: [PKG-031, PKG-033, PKG-034]
    outputs: [apps/cli/src/boot, apps/cli/src/profiles]
    acceptance:
      - 升包门槛已裁决：当前只有 CLI 一个真实应用 consumer，跨应用 Profile contract 未稳定；本轮不创建物理 boot 包并以双语 Note 记录回退决定
      - CLI 内部 resolved profile 从已解析启动选择构造，可确定性 JSON dump/hash；digest 仅绑定明确允许的安全投影
      - focused tests 证明 dump/hash 稳定、profile 选择变化会反映到 digest、列表顺序保留、secret/path/command/endpoint/prompt 正文不泄漏
      - Runtime 实际消费快照中的 max turns、sandbox 与 rollback settings；现有 CLI composition behavior 不变
      - CLI 当前模块文档与 V2 roadmap 区分当前安全投影和 proposed 的跨应用 Profile/Bundle/CompositionPlan

  - id: MEM-040
    phase: P4
    title: Memory Contract V2 与迁移
    owner: memory
    change_type: protocol
    depends_on: [CORE-028]
    outputs: [memory-v2-contract, adjacent-migration]
    acceptance:
      - MemoryRecordV1Schema 保持 strict 兼容读取；V2 contract 独立版本化，不切换现有 Runtime canonical store
      - V1 到 V2 相邻迁移需显式 owner、保留完整 source row、保持旧 scope、所有迁移项待审核且默认禁模型使用/导出
      - 迁移全量校验后独占发布 sidecar；已有目标、坏行或无效 owner 均失败，原始 records.jsonl 不变
      - status/scope/provenance/validity/governance/lineage 有 schema tests；Memory owner identity 不绑定来源 Session/Run

  - id: MEM-041
    phase: P4
    title: Memory lifecycle state machine
    owner: memory
    change_type: behavior
    depends_on: [MEM-040]
    outputs: [memory-lifecycle]
    acceptance:
      - V2 生命周期图覆盖 candidate review/activate/reject、dispute/resolve、supersede、revoke、expire 与 revalidate；非法转移和无效激活 fail closed
      - 每个合法转移产生 owner-scoped、content-free append-only event；sequence CAS、idempotency 与 hash-chain replay 可检查
      - lifecycle projection 可从 candidate seed 与完整事件重建；Runtime 的 V1 store 不被隐式切换

  - id: MEM-042
    phase: P4
    title: Context provenance 与 Memory 来源统一
    owner: context-memory
    change_type: protocol
    depends_on: [MEM-040, PKG-034]
    outputs: [context-provenance]
    acceptance:
      - recalled context 每项可回到 evidence refs 与确切 memory version
      - ContextManifest 绑定实际渲染内容的 digest/token estimate；retrieved、selected、adapter_invoked 状态可区分
      - dispatch_intent 在外部调用前持久化；adapter_invoked/response/failed/unknown 用追加事件表达
      - MemoryUse 只证明 Runtime 将对应内容交给 Provider Adapter，不声称远端接受或模型内部使用

  - id: MEM-043
    phase: P4
    title: Episode extraction 与 consolidation
    owner: memory
    change_type: behavior
    depends_on: [MEM-041, MEM-042, MEM-046]
    outputs: [memory-background-pipeline]
    acceptance:
      - bounded lease/backoff/idempotency
      - 主 Run settlement 不等待 extraction
      - extraction/consolidation 只产出可检查 candidate/diff；不得静默更新 active memory
      - 按 DEC-02 迁移 G-21：V2 默认关闭自动 Recall，用户显式开启后仅召回当前 scope/policy 允许的 active Memory；不得新增静默注入路径
      - 所有 Candidate（包括低风险）都须用户显式审核后才能 active；retrieved/selected/adapter_invoked 状态与来源可见

  - id: MEM-044
    phase: P4
    title: Experience Case schema 与 extractor
    owner: experience
    change_type: behavior
    depends_on: [MEM-043]
    outputs: [experience-case]
    acceptance:
      - success/failure/partial/unknown 与 applicability/counterexample 可表达
      - extractor input/result 有界且严格校验；证据引用唯一、来自实际输入并可回到 canonical Run Ledger
      - 非 unknown outcome 有 evidence-backed verification；Core 只生成确定性 candidate projection
      - Runtime 自动调度、持久化、审核、检索和上下文注入不在本任务范围

  - id: MEM-045
    phase: P4
    title: 冲突、过期与使用反馈
    owner: memory
    change_type: behavior
    depends_on: [MEM-041, MEM-042]
    outputs: [memory-conflict-feedback]
    acceptance:
      - 同 owner、显式 normalizedKey、scope 重叠且 claim 不同的未解决冲突组全部被 V2 recall eligibility gate 阻断
      - validFrom/validUntil、owner/scope、status、governance 与 source trust 在 V2 recall eligibility gate 中 fail closed
      - helpful/irrelevant/incorrect/stale feedback 绑定 exact Memory version、response-backed MemoryUse 与 ContextManifest
      - 同一用户针对一个 MemoryUse/version 最多一个反馈；相同评价重试幂等
      - incorrect/stale feedback 在明确 review dismissal 前阻断对应 Memory version；replay 校验 append-only hash chain
      - feedback events 不含 Memory claim、Context 正文或 Provider 响应；G-21 V1 Runtime 不被切换

  - id: MEM-046
    phase: P4
    title: Memory review/correct/revoke/delete 领域命令与当前控制面
    owner: memory-api
    change_type: feature
    depends_on: [MEM-045]
    outputs: [memory-control-contract, memory-control-surface-v1]
    acceptance:
      - 全部写入经 Command/Event
      - revoked/deleted/cross-scope 负测通过
      - Desktop/Web UI/CLI 可查看候选、active/disputed/revoked 状态、来源与 MemoryUse 请求状态
      - review/correct/revoke/delete 反馈到唯一领域服务，不由客户端各自写数据
      - 不依赖未来 framed RPC 实现细节；通过稳定内部 command/query seam 接入

  - id: MEM-047
    phase: P4
    title: Legacy Capsule v1
    owner: memory-export
    change_type: feature
    depends_on: [MEM-044, MEM-045, PKG-030]
    outputs: [legacy-capsule]
    acceptance:
      - v1 uses one strict fixed file set: manifest.yaml, memories.jsonl, experiences.jsonl, policies/usage-consent.yaml, README.md, SHA256SUMS
      - export is explicitly selected, policy-eligible, redacted, bounded, and excludes raw Events/Artifacts, credentials, approvals, and inherited permissions
      - offline verification rejects unsupported schemas, noncanonical/unsafe paths, malformed payloads, duplicate JSONL identities/keys, over-limit bundles, and checksum or payload-digest mismatch
      - preview creates no store or Ledger writes and returns deterministic new/duplicate/conflict/Experience-candidate review with a digest
      - explicit accept rechecks the exact bundle and current review digest, imports only selected Memory rows as local external/untrusted candidates, and is idempotent on retry
      - imported Experiences are returned as external-evidence candidates only until an Experience persistence/review aggregate exists

  - id: MEM-049
    phase: P4
    title: V2 Memory recall Runtime consumer
    owner: memory-runtime
    change_type: behavior
    depends_on: [MEM-042, MEM-045, MEM-046]
    outputs: [memory-v2-recall-consumer]
    acceptance:
      - V2 Recall 默认关闭；只有 Host 明确启用时才从 V2 Memory 控制面构建 Context，G-21 V1 Recall 路径保持独立
      - 每次检索先以 owner、workspace/project/run scope、当前 lifecycle/feedback/conflict、有效期、trust、consent 和 governance 快照执行 fail-closed eligibility gate
      - 只有通过 gate 的确切 Memory id/version 可以进入检索候选；Gate/ledger/store 异常时不回退到未过滤的 V1/V2 结果
      - ContextManifest 和 Ledger 能追到 Memory id/version、证据引用、retrieved/selected/adapter_invoked 状态；不声称 Provider/model 因果使用
      - 默认关闭、显式开启、scope/过期/撤销/冲突/反馈阻断、gate 故障与 Context provenance 有 focused/Runtime 负例

  - id: MEM-050
    phase: P4
    title: Experience 生命周期与 Runtime 召回消费者
    owner: experience
    change_type: behavior
    depends_on: [MEM-042, MEM-043, MEM-044, MEM-046]
    outputs: [experience-case-aggregate, experience-review, experience-retrieval-consumer]
    acceptance:
      - immutable candidate seed 与 owner/project scoped append-only lifecycle facts 可重放；review/validate、dispute、retire 有 CAS、幂等键和 hash-chain 验证
      - 只有显式审核的 validated Case 可进入召回，且每次均重新检查 owner/scope、有效性、条件匹配与 counterexamples；异常 fail closed
      - Runtime 默认不注入 Experience；显式启用时 ContextManifest 能标识 Case/version/source/evidence，并区分检索、选中和 adapter hand-off
      - Experience 仅作为含适用条件/反例/来源的建议，不直接执行 action，不把被注入或模型自述视作复用成功
      - candidate、review、replay、scope、stale/dispute/retire、负例和实际 Context hand-off 有 focused/Runtime 行为验证

