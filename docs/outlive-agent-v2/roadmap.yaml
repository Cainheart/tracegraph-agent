    owner: desktop
    change_type: feature
    depends_on: [API-062, PKG-035]
    outputs: [apps/desktop-host]
    acceptance:
      - built child 通过 Node IPC 校验精确 Desktop Host package/protocol version；不匹配在接受 RPC 前拒绝
      - 无 GUI child 经 stdin/stdout framed RPC 完成 schema-valid Session 查询，启动 IPC 只承载受信配置与 readiness
      - 独立进程写入的 durable active Run 在 child 启动恢复为 interrupted；Run projection 只有一个 run.interrupted，重复 Host 崩溃/重启不追加重复恢复事实
      - RPC EOF 后 Runtime 关停、Telemetry flush 并以 code 0 退出；进程崩溃后可重启并读取同一 canonical ledger

  - id: DESK-065
    phase: P6
    title: Desktop shell 与 DSH/Codex-like 共享工作台 UI
    owner: desktop
    change_type: feature
    depends_on: [DESK-064]
    outputs: [apps/desktop]
    acceptance:
      - Web 与 Desktop 都从 @tracegraph/workbench 导入同一 App、Workspace/Session 导航、对话/Run 活动与 Tool 状态 UI；apps/web 与 apps/desktop 仅作为组合根
      - App 必须注入 WorkbenchClient；Web 保留 HTTP/SSE adapter，Desktop 通过固定的 Main/preload RPC adapter 复用同一操作语义
      - Desktop 使用 exact-version apps/desktop-host、受信 main-frame 校验和 schema-valid IPC；Preview 明确标记且只使用 DemoTraceGraphClient
      - 本地 packaged renderer + CSP `connect-src 'none'`；nodeIntegration=false、contextIsolation=true、sandbox=true、无 HTTP/TCP listener
      - DESK-065 完成边界：当时 Host 尚无目录注册接口，实时工作台展示空 Workspace/Session；项目选择、persistent registration 与 credentials 随后由 DESK-066 补足

  - id: DESK-066
    phase: P6
    title: 原生目录、打开文件与 credential bridge
    owner: desktop-host
    change_type: feature
    depends_on: [DESK-065]
    outputs: [desktop-native-adapters]
    acceptance:
      - Electron Main 只从原生目录 picker 取得选择；Host 持久化规范路径、根目录身份和 opaque Workspace handle，Renderer 仅收安全 ProjectSummary/ID
      - Project list/register/remove 走固定 schema IPC 与私有 Main/Host control channel；Run/Session scope 绑定当前注册，移除只注销登记、不删除目录
      - 打开项目文件要求已注册 Project ID，经原生文件选择、realpath/普通文件检查及项目根 containment 校验，拒绝 symlink escape
      - Settings 可配置 Desktop ModelAdapter；API key write-only 传入 CredentialStore，配置文件只持久化 `${secret:NAME}` 引用，响应不回显值
      - macOS 使用 Keychain；其他支持平台使用私有权限文件后端且不声称硬件加密，后端错误 fail closed
      - Host 重启恢复有效项目，缺失或根目录身份变化的记录不扩大权限；测试覆盖持久性、注销不删目录、越权/逃逸和 secret redaction

