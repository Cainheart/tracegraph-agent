    acceptance:
      - Host 按操作返回可用/未配置/只读/策略禁用/不可用状态，三端入口同义且错误码一致
      - Desktop 补齐权限/用量/遥测/Skills/扩展/MCP/LSP/附件/Team/子 Agent/回放/回滚与真实公开流；已有审批/Todo/Artifact/Memory共同验收
      - 回放只读、恢复不自动重跑；模型请求和活动只展示公开受校验文本及真实回执
      - 保存模型连接、会话选项、本机完全访问资格、项目文件 CAS/回执协调与本机反馈经 HTTP/固定 preload/CLI 同义操作，密钥不回传
      - files.context 能力仅由真实 Host 装配提供；版本化文件选择在受理前校验权限/范围/哈希，Core 只接收可信装配快照并生成真实 scoped Artifact 与不可信 ContextManifest 来源

  - id: CLI-089
    phase: P8
    title: CLI 完整本机工作台操作与结构化回执
    owner: cli
    change_type: feature
    depends_on: [HOST-087, PAR-088]
    outputs: [apps/cli, docs/validation/unified-local-workbench]
    acceptance:
      - host/config/doctor/projects/chat/run/sessions/approval/todo/artifact/attachments/replay/rollback/experience/usage/lsp 命令族经同一业务控制器执行，保留既有 Team/Memory/Skills/MCP/扩展命令
      - 实时进度和 JSON/JSONL 对应真实事件/回执；错误码与退出码稳定，停止订阅不取消任务
      - 新增开发资源和定时任务有等价命令；凭据通过 stdin 读取，不出现在命令行参数/输出/诊断中
      - run start --context 经受限文件读取选择版本，最多 5 文件/每文件 64 KiB/合计 128 KiB；提交内容不能拼入 task，普通 chat 拒绝项目文件上下文
      - models、files、feedback 与 sessions options-get/options-set 提供真实操作；模型密钥仅 stdin，未知保存可按命令 ID reconcile，显式 host start 才解除已停止状态；应用完整退出后的明确新启动可启动后台，已有 Main 内的窗口重开不能解除停止

  - id: SET-090
    phase: P8
    title: 十类设置、真实生效与模型诊断
    owner: settings
    change_type: feature
    depends_on: [HOST-087, PAR-088]
    outputs: [packages/contracts, packages/host, packages/workbench, docs/validation/unified-local-workbench]
    acceptance:
      - 分类导航/搜索与常规/外观/模型/权限/Skills扩展/MCP-LSP/记忆隐私/开发/用量诊断/关于均展示当前值、来源、范围和生效时机
      - 保存与测试连接独立；错误 Key/模型/地址/超时/只读/存储失败分别呈现；小请求不携带项目或聊天，进行中 Run 绑定原配置
      - Recall 默认关闭，项目范围和审核/同意约束保留；工具/遥测设置按声明的重启时机真实应用
      - 加载、空态、只读、失败、策略禁用区分，错误后不会永久加载；设置 CAS 防并发覆盖
      - 多服务配置与单服务旧数据迁移、独立测试与会话选项持久化；任务受理冻结模型/凭据版本，删除/替换不影响已受理任务
      - 完全访问资格保存在本机且可撤销，与会话选择和管理员上限分离；重启待生效期间不得声称完全访问已经获得

  - id: DEV-091
    phase: P8
    title: 本地 Git/worktree、PTY 终端和网页预览
    owner: developer-workbench
    change_type: feature
    depends_on: [HOST-087, PAR-088, SET-090]
    outputs: [packages/host, packages/workbench, apps/desktop, apps/cli, docs/validation/unified-local-workbench]
    acceptance:
      - Git 状态/三类 diff/暂存/提交/分支/worktree 创建选择移除真实执行；丢弃先显示范围，活跃 worktree 不移除
      - node-pty/xterm 终端归 Host 管理；客户端关闭不结束进程，重连有限历史；显式关闭终止，崩溃后不自动重跑且遵守实际沙箱
      - 项目预览注册/启动/地址健康/停止可操作；Web 受控预览与 Desktop 隔离浏览视图，不开放任意远端浏览
      - CodeMirror 编辑 UTF-8 文本、受限图片预览；保存携带哈希/命令 ID，经项目范围/符号链接/权限/审批/工作区协调，磁盘内容与 Ledger 回执一致
      - 冲突保留缓冲；未知写入只协调不自动重写；计划模式禁止 Agent 写入，独立的人类保存仍按显式权限与审批处理

