    owner: cli
    change_type: refactor
    depends_on: [API-062]
    outputs: [apps/cli]
    acceptance:
      - run start/get/events 与 sessions list/get 使用共享 protocol/contracts schema，通过 TraceGraphClient 进入同一 Host RunSessionController；无效输入在 bootstrap 前拒绝
      - 成功 stdout 仅包含 schema-valid protocol JSONL reply/event；diagnostics 写 stderr，Host failure 不产生成功形状输出
      - Run ledger JSONL event identity/sequence/payload 与同一 Host 的 SDK/Web canonical event stream 逐条一致，follow 从快照末尾 sequence 继续
      - 只连接已运行 Host；不创建第二个 Runtime/Controller，不绑定 API-062 framed RPC dispatcher

  - id: DESK-064
    phase: P6
