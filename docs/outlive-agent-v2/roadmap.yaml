    owner: client-protocol
    change_type: refactor
    depends_on: [API-060]
    outputs: [packages/api, packages/host/webserver]
    acceptance:
      - 无 HTTP 依赖的 @tracegraph/api Run/Session Controller 可进程内调用，绑定注册 Workspace/Session scope，并覆盖 command-id 幂等与单活动 Run 协调
      - Host Run start/read 与 Session list/read/resume 路由调用共享 Controller；HTTP 认证、状态/缓存语义及 SSE 留在本地 webserver adapter
      - "@tracegraph/host/webserver 子路径公开 Fastify 实现，包根保持兼容；架构策略和模块图包含新的 api 包"
      - Settings、项目生命周期、扩展、MCP/LSP、Team、Memory、Artifact 内容与 SSE 领域编排明确留待后续切片

  - id: API-062
    phase: P6
    title: Desktop/CLI 内部 framed RPC conformance
    owner: client-protocol
    change_type: protocol
    depends_on: [API-061]
    outputs: [packages/sdk/client, packages/sdk/server]
    acceptance:
      - 私有 4 字节大端长度帧；默认单帧 8 MiB 上限；增量 partial/coalesced decoding 和严格 UTF-8/JSON/schema/version 校验
      - client pending、server in-flight 与 writer queued bytes 都有有限上限；序列化写入等待 WHATWG stream backpressure
      - request-scoped transport cancel 只 abort 对应 handler signal，不作为 Run cancel command
      - conformance 覆盖 partial/coalesced frame、长度/截断拒绝、cancel 目标、背压、版本错配和 in-flight 上限；不形成外部 RPC 产品，不绑定 Host/API Controller，也不迁移 CLI/Desktop

  - id: CLI-063
    phase: P6
