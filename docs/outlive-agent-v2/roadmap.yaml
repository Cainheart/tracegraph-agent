  - id: UX-086
    phase: P8
    title: Codex 风格全页面与三端本地工作台二次验收
    owner: workbench
    change_type: feature
    depends_on: [DESK-065, DESK-066, CLIENT-068, I18N-075, HOST-087, PAR-088, CLI-089, SET-090, DEV-091, RUN-092, BRAND-093, MEDIA-094]
    outputs: [packages/workbench, packages/api, packages/sdk, apps/web, apps/desktop, apps/desktop-host, docs/validation/ui-086-workbench-ux]
    acceptance:
      - 以当前 Codex 工作台为交互参考，交付可复核的核心用户旅程与 Outlive 能力差距表；复用通用交互模式，不复制品牌、素材或声称一比一复刻
      - 共享 Workbench 形成一致的信息架构与视觉层级，覆盖项目/会话导航、对话与任务输入、模型设置、Run/Tool 活动、变更审阅与结果；空态、加载、失败和 unavailable 状态均明确
      - Web 与 Desktop 均能通过真实 client/Host 完成项目选择、新建对话/任务、切换与恢复 Session、发送后续指令、steer/cancel、查看 Run/Tool 状态及变更/测试结果；Desktop 对已有 canonical controller 支持的 Approval/Todo/Artifact 操作补齐 schema-validated route，不以静态控件冒充可用功能
      - 继续遵守 Outlive 的权限、审批、Memory consent 和 Preview 标记语义；云任务、账号同步、多人共享等未纳入 Outlive 的 Codex 能力明确列为范围外
      - Web 与 Desktop 在 1440×900、1280×800 和 1024×768 下通过主要交互与布局验收；键盘可完成核心导航/提交，窄视口不得把核心工作台降级为只读告警
      - Web/Desktop 用户旅程测试与有状态截图覆盖空工作区、活动 Run、工具结果和变更审阅；真实模式与 Preview 数据边界可观察且不混淆

      - 保留首轮 UX-086 历史证据；二次验收移除置顶/顶部设置/常驻页签，头像设置入口、紧凑公开进度与真实结果展开一致
      - 现有全页面、十类设置及 Git/终端/预览/定时任务入口在 Web/Desktop 三种尺寸验证；CLI 有等价真实操作
      - 新对话、项目和历史会话共用 Composer；左侧加号附件/项目文件上下文、权限/计划与右侧会话模型/推理、权限与执行/计划模式接入真实控制器，中文输入法和发送快捷键保持有效
      - 默认仅公开当前说明与一行真实活动，点击展开不执行任务；回答复制/本机反馈、逐 Run 写入卡片及文件/变更/终端/预览/成果面板由真实事件与资源驱动
      - 宽度 1200px 起使用右侧面板，较窄使用全屏；关闭、切换、重连保留草稿、附件、未保存文件；明暗与三尺寸通过实际客户端验收

  - id: HOST-087
    phase: P8
    title: 随应用管理的共享 profile 与单一后台运行时
    owner: host
    change_type: feature
    depends_on: [API-061, DESK-066, CLIENT-068]
    outputs: [packages/host, docs/validation/unified-local-workbench]
    acceptance:
      - Web loopback HTTP 与 Desktop/CLI 认证私有通道使用同一 Runtime、profile、业务控制器和规范 Ledger
      - 双客户端启动只有一个写入者；关闭窗口只 detach，显式停止 Host 才停止服务；不默认安装开机启动
      - 旧数据迁移扫描、预览、冲突选择、备份、一次提交与回退保留源数据/原始事件/凭据引用，拒绝旧活跃写入者且不自动执行历史任务
      - 安装包携带独立运行时；自动启动/监测/重连/安全恢复，不依赖用户 Node/pnpm，未指定端口时自动选择可用端口
      - 普通 Web/Desktop/CLI 流程自动连接同一 owner；异常恢复不自动重跑历史任务或重复 side effect
      - 共享连接监督器覆盖外部 CLI 重启、崩溃、唤醒和显式停止，单一恢复请求更新实例/凭据/订阅，游标补齐且不重新提交任务
      - 明确的新应用进程启动可恢复已停止 owner；已有 Main 的激活/重开仍保持停止意图，恢复不提交或重跑任务
      - 连接状态与能力状态分离；已读值保留，失败不能显示安装版本不支持，普通界面提供中文恢复操作

