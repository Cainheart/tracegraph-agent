<script>

function sceneNotice(){const scenes={offline:['连接已断开','草稿和编辑内容保留。修复连接后检查已提交操作的回执；不会自动重发。','修复连接','recover','error'],recovering:['正在恢复连接','正在确认当前会话与运行快照，尚未确认可用的操作保持禁用。','查看恢复详情','connection',''],unconfigured:['先连接所需能力','普通对话可继续使用已配置模型。要执行本页功能，请补齐对应连接或系统授权。','打开相关设置','settings',''],readonly:['此项由管理员管理','可查看当前值、来源及实际范围。更改需使用可写的项目覆盖或联系配置管理者。','查看配置来源','sources',''],pending:['变更已保存，等待安全空闲应用','运行中的模型快照保持原值；待当前任务释放资源后应用新配置。','检查待应用变更','pending','warning'],conflict:['设置已在另一端更改','保留本页草稿。先比较差异，再重新保存，避免覆盖他人的更新。','比较差异','history','warning'],unknown:['操作结果尚未确认','先检查同一操作的回执与文件状态。确认之前暂停后续写入，不自动重试。','检查本次操作','reconcile','warning'],failed:['本次任务需要处理','测试发现登录失败，仅影响此任务。修复问题后可在有限预算内继续。','查看失败证据','failure','error'],handover:['已让出电脑控制权','检测到你的鼠标或键盘输入，Agent 已停手。确认当前目标窗口后再交还。','预览并交还控制','handover','warning'],locked:['电脑已锁屏，界面操作暂停','后台非界面任务继续；解锁后先预览目标，再由你明确交还控制。','查看暂停原因','handover',''],queued:['下一条消息已排队','将在当前步骤结束后处理。需要立即改变方向，可选择显式引导。','改为立即引导','steer','']};const x=scenes[state.scene];return x?`<div class="notice ${x[4]}">${icon(['unknown','readonly'].includes(state.scene)?'shield':'link')}<div><strong>${x[0]}</strong><p>${x[1]}</p><div class="actions">${btn(x[2],x[3])}</div></div></div>`:'';}

function modalMarkup(kind){const titleMap={'file-context':'添加文件与文件夹上下文','model-edit':'模型连接与能力测试','agent-new':'分派 Agent','agent-detail':'UI Agent · 任务详情','goal-new':'创建有限预算目标','handover':'预览并交还电脑控制','computer-grant':'应用授权','tool-add':'添加工具连接','history':'配置历史与差异','acceptance':'最终交付验收','evidence':'视觉证据与保留','profile-export':'选择性导出','project':'添加项目','skill-install':'安装或导入 Skill','context-preview':'发送前预览上下文'};const title=titleMap[kind]||'检查当前操作';let content='';if(kind==='file-context')content=`<p>先预览范围和排除项，只读取实际选中的内容。文件版本与来源随上下文显示。</p><div class="scope-row"><span>Atlas 项目</span><span>排除：.git / node_modules / 凭据文件</span></div><label><input type="checkbox" checked>src/LoginForm.tsx <small>UTF-8 · 4.2 KiB · 82bc…</small></label><label><input type="checkbox">src/components/ <small>文件夹范围 · 按需读取</small></label><label><input type="checkbox">tests/login.spec.ts <small>UTF-8 · 2.1 KiB</small></label><p class="annotation">文件、文件夹、@skill / @session / @agent 均有明确范围；当前只展示模拟选择。</p>`;else if(kind==='model-edit')content=`<p>凭据只写。保存配置不等于能力通过；每个小额测试由你明确触发。</p><label>连接名称<input value="OpenAI / Atlas"></label><div class="form-line"><label>提供商<select><option>OpenAI compatible</option><option>Anthropic</option></select></label><label>默认模型<input value="gpt-4.1"></label></div><label>API Key<input type="password" placeholder="新 Key（原型不保存、不发送）" autocomplete="off"></label><div class="scope-row"><span>文本：尚未测试</span><span>工具：尚未测试</span><span>图片：尚未测试</span><span>结构化：尚未测试</span></div>`;else if(kind==='agent-new')content=`<p>总预算包含此子任务。子 Agent 不扩大父任务权限，写入隔离 Worktree 后集中审阅。</p><label>角色<select><option>UI 验证 Agent</option><option>Review Agent</option><option>实现 Agent</option></select></label><label>具体任务<textarea rows="3">核对登录失败焦点、成功登录与控制台入口；保存三种尺寸证据。</textarea></label><div class="form-line"><label>模型<select><option>GPT-4.1 · 图片能力已测试</option></select></label><label>token 上限<input type="number" value="12000"></label><label>时间（分钟）<input type="number" value="12"></label></div><label><input type="checkbox" checked>隔离写入，父任务集中审阅</label>`;else if(kind==='goal-new')content=`<p>填写有限总预算，明确可验证完成条件；最终由你确认，而非模型自行宣布。</p><label>目标<input value="交付登录与控制台"></label><label>完成条件<textarea rows="3">功能测试通过、UI与Review独立校验完成、用户审阅文件与证据后确认。</textarea></label><div class="form-line"><label>token 上限<input type="number" value="80000"></label><label>时间（分钟）<input type="number" value="45"></label></div><label>费用上限（可选）<input placeholder="未设置；缺失成本仍为未知"></label><label><input type="checkbox" checked>保留用户修改，不自动提交与发布</label>`;else if(kind==='handover')content=`<p>Agent 因你的输入或锁屏而暂停。核对目标后明确交还，不自动抢回控制权。</p><div class="app-preview"><div class="app-preview-inner" style="min-height:130px"><h3>Atlas / 登录窗口</h3><p>仅此窗口 · 静态原型，不是实际屏幕</p></div></div><label><input type="checkbox">我确认当前目标和批准范围，可以继续操作</label>`;else if(kind==='computer-grant')content=`<p>电脑授权独立于文件完全访问。平台系统能力和应用授权分别核对。</p><label>应用<select><option>Atlas 测试应用</option><option>Chrome</option><option>Visual Studio Code</option></select></label><label>授权时长<select><option>仅本次目标</option><option>始终（可撤销）</option></select></label><div class="check-list"><label><input type="checkbox" checked>读取选定窗口</label><label><input type="checkbox" checked>点击与输入</label><label><input type="checkbox">允许其它窗口（需明确说明）</label></div>`;else if(kind==='tool-add')content=`<p>先选择模板和连接方式，核对工具、范围及新增权限；Key使用受管理引用。</p><div class="form-line"><label>连接类型<select><option>本机 stdio</option><option>远程 HTTPS MCP</option></select></label><label>模板<select><option>自定义连接</option><option>项目工具</option></select></label></div><label>名称<input value="Project tools"></label><label>程序 / 地址<input placeholder="选择实际程序或 HTTPS 地址"></label><label>凭据引用<input placeholder="受管理的凭据名称"></label><details class="settings-advanced"><summary>高级参数</summary><textarea rows="4">{ "args": [], "scope": "Atlas" }</textarea></details>`;else if(kind==='history')content=`<p>比较保存值、来源及生效条件。恢复前预览范围，不覆盖未提交草稿。</p><table class="data-table"><thead><tr><th>字段</th><th>旧值</th><th>新值</th></tr></thead><tbody><tr><td>推理强度</td><td>默认</td><td>高</td></tr><tr><td>预览打开</td><td>面板</td><td>浏览器</td></tr><tr><td>模型来源</td><td>个人全局</td><td>Atlas覆盖</td></tr></tbody></table><div class="scope-row"><span>配置版本 12 → 13</span><span>运行快照不变</span><span>空闲安全应用</span></div>`;else if(kind==='acceptance')content=`<p>此处是设计示例，尚未实际完成交付。真实产品须呈现任务事实、文件、测试与校验证据再由你确认。</p><div class="check-list"><label><input type="checkbox">文件变更已审阅</label><label><input type="checkbox">功能与独立UI证据已核对</label><label><input type="checkbox">风险与未完成项已说明</label></div><label>验收反馈<textarea rows="3" placeholder="确认或需要继续修改的具体项…"></textarea></label>`;else if(kind==='evidence')content=`<p>证据默认30天，pin后独立保留。截图范围、读取方法、任务及操作来源清楚可见。</p><div class="scope-row"><span>被测 Atlas 窗口</span><span>1280 × 800</span><span>可访问控件 + 截图核对</span></div><div class="preview-frame"><div class="preview-content"><h3>Atlas 校验截图</h3><p>本图为原型画面，不是实际测试截图。</p></div></div><label><input type="checkbox">Pin 此证据</label><small>普通保留至：2026年11月4日</small>`;else if(kind==='profile-export')content=`<p>仅导出你明确选择的本机内容。凭据、私有推理和未同意记忆不会加入。</p><div class="check-list"><label><input type="checkbox" checked>昵称与个人说明</label><label><input type="checkbox">用量汇总</label><label><input type="checkbox">选择的作品和公开任务记录</label><label><input type="checkbox">明确允许导出的Memory版本</label></div>`;else if(kind==='skill-install')content=`<p>先预览来源、Skill文件与工具权限。更新扩权要再次同意，不能仅以可信来源代替授权。</p><label>来源<select><option>本机文件夹导入</option><option>已核对的来源地址</option><option>创建新的Skill</option></select></label><label>范围<select><option>Atlas 项目覆盖</option><option>个人全局</option></select></label><div class="scope-row"><span>待核对：Skill内容与版本</span><span>待核对：工具读取 / 写入权限</span></div>`;else if(kind==='context-preview')content=`<p>发送前预览准确上下文；全局快捷键只打开此预览，不自动发送。</p><label><input type="checkbox" checked>选定 Atlas 窗口 · 示例画面</label><label><input type="checkbox" checked>src/LoginForm.tsx · 指定文件版本</label><label><input type="checkbox">系统剪贴板 · 需明确选择</label><div class="scope-row"><span>用途：登录界面校验</span><span>模型：GPT-4.1</span><span>发送内容可删除</span></div>`;else content=`<p>当前状态：${sceneTitles[state.scene]}。范围：${state.scope==='项目'?'Atlas项目':state.scope}。本操作是设计演示，不会调用模型、Host或电脑接口。</p><div class="notice"><div><strong>先核对具体范围与结果</strong><p>保存值、实际值和来源分开；未知写入需要检查原操作；修复连接不自动重发。</p></div></div>`;return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><header><h2>${title}</h2><button class="icon-button" data-action="close-modal" aria-label="关闭弹窗">${icon('close')}</button></header><span class="prototype-pill" style="margin-bottom:15px">设计模拟 · 无真实操作</span>${content}<footer>${btn('取消','close-modal')}${btn('确认设计中的这一步','modal-confirm',true)}</footer></section></div>`;}

function popover(kind){let items=[],cls='';if(kind==='add')items=[['file','文件与文件夹上下文','file-context'],['file','附加图片 / PDF','attach'],['file','引用 @file / @skill / @session / @agent','reference'],['goal','创建目标','goal-new']];if(kind==='model'){items=[['link','GPT-4.1 · 项目主模型','choose-model:GPT-4.1'],['link','Claude Sonnet · 已授权服务','choose-model:Claude Sonnet'],['check','推理强度 · 提供商默认','effort:提供商默认'],['check','推理强度 · 高','effort:高'],['settings','模型连接与能力测试','settings:models']];cls='model';}if(kind==='permission')items=[['shield','只读','choose-permission:只读'],['shield','项目访问','choose-permission:项目访问'],['shield','完全访问 · 文件权限','choose-permission:完全访问'],['computer','独立电脑授权','computer-grant'],['settings','查看有效策略与来源','settings:permissions']];if(kind==='account')items=[['agent','个人概览','usage'],['goal','长期目标','goals'],['bell','通知与后台','settings:notifications'],['settings','设置','settings'],['help','帮助','help-page']];$('#overlays').innerHTML+=`<div class="popover ${cls}" role="menu" aria-label="${kind==='model'?'模型与推理选择':kind==='add'?'添加上下文':kind==='account'?'个人菜单':'权限选择'}">${items.map(([i,l,a])=>`<button role="menuitem" data-action="${a}">${icon(i)}${l}</button>`).join('')}<small>目标设计 · 不派发真实请求</small></div>`;}
function action(a){$('#overlays .popover')?.remove();if(a.startsWith('panel:')){state.panel=a.split(':')[1];render();return;}if(a.startsWith('settings:')){state.route='settings';state.category=a.split(':')[1];state.panel=null;render();return;}if(a.startsWith('choose-model:')){state.model=a.slice(13);render();return;}if(a.startsWith('choose-permission:')){state.permission=a.slice(18);render();return;}if(a.startsWith('effort:')){state.effort=a.slice(7);render();return;}if(a.startsWith('suggestion:')){state.drafts[state.route]=a.slice(11);render();$('#draft')?.focus();return;}if(a.startsWith('model-test:')){state.modal='model-edit';renderOverlays();showToast('先确认小测试用途；本原型不会调用模型');return;}if(['add','model','permission','account'].includes(a)){popover(a);return;}if(a==='close-panel'){state.panel=null;render();return;}if(a==='close-help'){state.help=null;renderOverlays();return;}if(a==='close-modal'){state.modal=null;renderOverlays();return;}if(a==='help'){state.help=state.route==='settings'?state.category:state.route;renderOverlays();return;}if(a==='help-page'){state.route='help';state.panel=null;state.help=null;render();return;}if(a==='plan'){state.mode=state.mode==='plan'?'execute':'plan';render();return;}if(a==='take-control'){state.scene='handover';render();return;}if(a==='approve'){state.scene='running';render();showToast('演示批准后的状态，未执行实际写入');return;}if(a==='reject'){state.scene='ready';render();showToast('演示拒绝，未修改文件');return;}if(a==='recover'){state.scene='recovering';render();showToast('展示恢复中，不连接服务');return;}if(a==='modal-confirm'){const kind=state.modal;if(kind==='file-context'){state.contexts.push('src/LoginForm.tsx');}state.modal=null;render();showToast('只在设计稿中演示确认，未保存或派发');return;}if(['copy','feedback','pin','download','unarchive','tool-restart','terminal-close','preview-stop','clear-key','revoke','memory-revoke','delete','reset-shortcut','reset-all','stop-background','pause'].includes(a)){showToast('已演示“'+a+'”入口，不产生真实副作用');return;}if(['agents','goals','memory','skills','tools','browser','computer','usage','archive','settings','chat'].includes(a)){state.route=a==='chat'?'chat-project':a;state.panel=null;state.help=null;render();return;}state.modal=a;renderOverlays();}
document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){state.route=route.dataset.route;state.panel=null;render();return;}const category=e.target.closest('[data-settings]');if(category){state.route='settings';state.category=category.dataset.settings;state.panel=null;render();return;}const act=e.target.closest('[data-action]');if(act){e.preventDefault();action(act.dataset.action);return;}const help=e.target.closest('[data-help]');if(help){state.help=help.dataset.help;renderOverlays();return;}const agent=e.target.closest('[data-agent-tab]');if(agent){state.agentTab=agent.dataset.agentTab;render();return;}const mem=e.target.closest('[data-memory-tab]');if(mem){state.memoryTab=mem.dataset.memoryTab;render();return;}const scope=e.target.closest('[data-scope]');if(scope){state.scope=scope.dataset.scope;render();return;}const remove=e.target.closest('[data-remove-context]');if(remove){e.preventDefault();state.contexts.splice(Number(remove.dataset.removeContext),1);render();return;}const detail=e.target.closest('[data-detail]');if(detail){const rows={read:['读取项目文件','文件：src/LoginForm.tsx · UTF-8 · 指定版本','只读操作 · 模拟回执'],patch:['应用已批准修改','范围：2个文件 · 与具体审批绑定','结果已核对 · 模拟回执'],test:['运行登录流程测试','12个用例 · 同一任务与工作区','命令、完整输出、耗时放在此项钻取层']};const x=rows[detail.dataset.detail];$('#activity-detail').innerHTML=`<div class="activity-detail"><strong>${x[0]}</strong><p>${x[1]}</p><p>${x[2]}</p><button class="help-link" data-action="panel:artifacts">查看对应证据</button></div>`;}});
document.addEventListener('input',e=>{if(e.target.id==='draft')state.drafts[state.route]=e.target.value;if(e.target.id==='global-search')state.query=e.target.value;if(e.target.id==='settings-search'){const q=e.target.value;document.querySelectorAll('.settings-nav [data-settings]').forEach(n=>n.hidden=!n.textContent.includes(q));}if(e.target.dataset.color)$('#stage').style.setProperty('--'+e.target.dataset.color,e.target.value);});
document.addEventListener('change',e=>{if(e.target.id==='route'){state.route=e.target.value;state.panel=null;render();}if(e.target.id==='scene'){state.scene=e.target.value;render();}if(e.target.id==='theme'){state.theme=e.target.value;render();}if(e.target.id==='viewport'){state.width=e.target.value;render();}if(e.target.dataset.prototypeSetting){if(e.target.dataset.prototypeSetting==='设置主题'){state.theme=e.target.value==='深色'?'dark':'light';render();}showToast('只预览“'+e.target.dataset.prototypeSetting+'”，不保存真实设置');}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='composer'){state.drafts[state.route]=$('#draft').value;if(state.scene==='running')state.scene='ready';else if(state.drafts[state.route].trim())state.scene='running';render();showToast('演示输入与运行状态；没有发送到模型');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.modal=null;state.help=null;renderOverlays();}if(state.modal&&e.key==='Tab'){const controls=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea')].filter(x=>!x.disabled&&x.getClientRects().length);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
$('#open-review').addEventListener('click',()=>{state.route='help';state.panel=null;render();});
const initial=new URLSearchParams(location.hash.slice(1));if(initial.has('page')&&pageTitles[initial.get('page')])state.route=initial.get('page');if(initial.has('state')&&sceneTitles[initial.get('state')])state.scene=initial.get('state');if(initial.get('theme')==='dark')state.theme='dark';if(['1440','1280','1024'].includes(initial.get('width')))state.width=initial.get('width');if(categories.some(x=>x[0]===initial.get('category')))state.category=initial.get('category');if(['files','changes','terminal','preview','artifacts'].includes(initial.get('panel')))state.panel=initial.get('panel');render();
</script>
</body>
</html>
