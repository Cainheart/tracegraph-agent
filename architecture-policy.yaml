version: 2
global:
  forbid_cycles: true
  forbid_deep_imports: true
packages:
  - name: '@tracegraph/cli'
    root: apps/cli
    governance: legacy
    migration_owner: cli-runtime
    allowed:
      - '@tracegraph/codegraph'
      - '@tracegraph/contracts'
      - '@tracegraph/core'
      - '@tracegraph/host'
      - '@tracegraph/lsp'
      - '@tracegraph/mcp'
      - '@tracegraph/retrieval'
      - '@tracegraph/retrieval-service'
      - '@tracegraph/session'
      - '@tracegraph/sdk'
      - '@tracegraph/telemetry'
      - '@tracegraph/test-support'
    forbidden: ['@tracegraph/context', '@tracegraph/evidence']
  - name: '@tracegraph/retrieval-service'
    root: apps/retrieval-service
    governance: legacy
    migration_owner: retrieval-service
    allowed: ['@tracegraph/retrieval']
    forbidden: ['@tracegraph/cli', '@tracegraph/context', '@tracegraph/core', '@tracegraph/evidence', '@tracegraph/host', '@tracegraph/sdk', '@tracegraph/web']
  - name: '@tracegraph/web'
