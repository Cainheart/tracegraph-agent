packages:
  - apps/*
  - packages/*
  - examples/*

saveExact: true
resolutionMode: time-based
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
blockExoticSubdeps: true
linkWorkspacePackages: true
preferWorkspacePackages: true

allowBuilds:
  esbuild: true

catalog:
  '@fastify/cors': 11.3.0
  '@types/node': 22.20.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  fastify: 5.12.5
  mermaid: 12.0.0
  react: 19.3.0
  react-dom: 19.3.0
  tsx: 4.23.13
  typescript: 7.0.2
  vite: 8.3.0
  vitest: 5.0.1
  zod: 4.6.5

overrides:
  lodash-es: 4.18.1

minimumReleaseAgeExclude:
  - '@types/node@22.20.3'
  - fastify@5.12.5
